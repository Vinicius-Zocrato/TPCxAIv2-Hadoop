  - default
  - conda-forge
dependencies:

#default
#-workloads
  - python=3.9
  - setuptools=59.8
  - pandas=1.5.3
  - scikit-learn=1.2.2
  - xgboost=1.7.4
  - numpy=1.23.5
  - nose=1.3.7
  - scipy=1.10.1
  - statsmodels=0.13.5
  - patsy=0.5.3
  - tqdm=4.65
